global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: orderers
    static_configs:
      - targets:
          - orderer0.example.com:8443
          - orderer1.example.com:8443
          - orderer2.example.com:8443

  - job_name: peers
    static_configs:
      - targets:
          - peer0.org1.example.com:9440
          - peer1.org1.example.com:9441

---
# Caliper 0.6 Fabric network configuration for Paper 3.
# Run setup-caliper.sh first — it resolves the Admin private key path
# and writes paper3-network-resolved.yaml with the correct keystore filename.
name: paper3-network
version: "2.0.0"
caliper:
  blockchain: fabric

channels:
  - channelName: paper3channel
    contracts:
      - id: directed-traceability
        contractID: directed-traceability

organizations:
  - mspid: Org1MSP
    identities:
      certificates:
        - name: Admin
          clientPrivateKey:
            path: "__ADMIN_KEY_PATH__"
          clientSignedCert:
            path: "../network/crypto-config/peerOrganizations/org1.example.com/users/Admin@org1.example.com/msp/signcerts/Admin@org1.example.com-cert.pem"
    connectionProfile:
      path: "./networks/connection-org1.yaml"
      discover: true

---
# Fabric SDK connection profile for Paper 3 experiments.
# Caliper runs on the VM host; peers/orderers are reachable via /etc/hosts entries
# that resolve the Fabric DNS names to localhost (127.0.0.1).
name: paper3-connection
version: "1.0"

client:
  organization: Org1MSP
  connection:
    timeout:
      peer:
        endorser: "300"

channels:
  paper3channel:
    peers:
      peer0.org1.example.com:
        endorsingPeer: true
        chaincodeQuery: true
        ledgerQuery: true
        eventSource: true
      peer1.org1.example.com:
        endorsingPeer: true
        chaincodeQuery: true
        ledgerQuery: true
        eventSource: false
    orderers:
      - orderer0.example.com

organizations:
  Org1MSP:
    mspid: Org1MSP
    peers:
      - peer0.org1.example.com
      - peer1.org1.example.com

peers:
  peer0.org1.example.com:
    url: grpcs://peer0.org1.example.com:7051
    grpcOptions:
      ssl-target-name-override: peer0.org1.example.com
      hostnameOverride: peer0.org1.example.com
    tlsCACerts:
      path: "../network/crypto-config/peerOrganizations/org1.example.com/tlsca/tlsca.org1.example.com-cert.pem"

  peer1.org1.example.com:
    url: grpcs://peer1.org1.example.com:9051
    grpcOptions:
      ssl-target-name-override: peer1.org1.example.com
      hostnameOverride: peer1.org1.example.com
    tlsCACerts:
      path: "../network/crypto-config/peerOrganizations/org1.example.com/tlsca/tlsca.org1.example.com-cert.pem"

orderers:
  orderer0.example.com:
    url: grpcs://orderer0.example.com:7050
    grpcOptions:
      ssl-target-name-override: orderer0.example.com
      hostnameOverride: orderer0.example.com
    tlsCACerts:
      path: "../network/crypto-config/ordererOrganizations/example.com/tlsca/tlsca.example.com-cert.pem"

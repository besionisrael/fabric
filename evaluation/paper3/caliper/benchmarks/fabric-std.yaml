---
# Benchmark: fabric-std
# Baseline -- directed-traceability chaincode, no custom orderer, no ZK.
test:
  name: fabric-std
  description: >
    Baseline throughput and latency for the directed-traceability chaincode
    running on stock Fabric 3.x (no constraint-aware orderer, no ZK proofs).

  workers:
    number: 2

  rounds:
    - label: register-warmup
      description: Warmup - 100 tx at 10 TPS to prime JIT and caches.
      txNumber: 100
      rateControl:
        type: fixed-rate
        opts:
          tps: 10
      workload:
        module: workloads/register-resource.js
        arguments:
          chaincodeId: directed-traceability
          prefix: "std-w"

    - label: register-sustained
      description: Sustained load - 120 s at 50 TPS (RegisterResource).
      txDuration: 120
      rateControl:
        type: fixed-rate
        opts:
          tps: 50
      workload:
        module: workloads/register-resource.js
        arguments:
          chaincodeId: directed-traceability
          prefix: "std-s"

    - label: register-stress
      description: Stress - 60 s at 200 TPS to measure saturation point.
      txDuration: 60
      rateControl:
        type: fixed-rate
        opts:
          tps: 200
      workload:
        module: workloads/register-resource.js
        arguments:
          chaincodeId: directed-traceability
          prefix: "std-x"

    - label: transfer-sustained
      description: Transfer round - 120 s at 30 TPS (read-modify-write path).
      txDuration: 120
      rateControl:
        type: fixed-rate
        opts:
          tps: 30
      workload:
        module: workloads/transfer-resource.js
        arguments:
          chaincodeId: directed-traceability
          prefix: "std-t"
          poolSize: 200

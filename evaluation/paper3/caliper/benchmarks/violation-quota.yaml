---
# Benchmark: violation-quota
#
# Measures the C_global quota violation rate under the three enforcement variants.
#
# Run this benchmark TWICE:
#   1. With standard orderers (fabric-std / zk-exogenous):
#        caliper launch manager ... --caliper-benchconfig benchmarks/violation-quota.yaml
#        → record Succ/Fail, then run measure-violations.sh
#
#   2. With custom orderer (orderer-endogenous):
#        Swap orderer image (see README), then re-run same command.
#        → record Succ/Fail, then run measure-violations.sh
#
# Expected results:
#   fabric-std / zk-exogenous:
#     All POOL_SIZE transfers succeed per worker → |S_sub| = POOL_SIZE+1 >> K_MAX
#     Violation count = Succ - (K_MAX - 1)
#
#   orderer-endogenous:
#     Only (K_MAX - 1) = 1 transfer succeeds per worker (introduces 1 new holder)
#     Remaining POOL_SIZE - 1 timeout (orderer drops them from block)
#     |S_sub| = K_MAX = 2 → 0 violations
#
# Design note: poolSize = 20, K_MAX = 2, 2 workers → 40 total Transfer attempts.
# Expected violations in fabric-std: 40 - 2*(K_MAX-1) = 40 - 2 = 38.
# Expected violations in orderer-endo: 0.

test:
  name: violation-quota
  description: >
    C_global quota violation rate under concurrent Transfers.
    K_MAX = 2 concurrent holders per SubsetGroup.
    Measures whether the orderer enforces MaxConcurrent under concurrent load.

  workers:
    number: 2

  rounds:
    - label: quota-violation
      description: >
        Burst 40 concurrent Transfers (20 per worker) to unique new agents,
        all resources in the same per-worker SubsetGroup with MaxConcurrent = 2.
        fabric-std: all succeed (38 violations).
        orderer-endogenous: 2 succeed, 38 timeout (0 violations).
      txNumber: 40
      rateControl:
        type: fixed-rate
        opts:
          tps: 50
      workload:
        module: workloads/violation-quota.js
        arguments:
          chaincodeId: directed-traceability
          prefix: "viol"
          poolSize: 20
          kMax: 2

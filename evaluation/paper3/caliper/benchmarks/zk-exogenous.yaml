---
# Benchmark: zk-exogenous
# ZK proof verification done inside the chaincode (exogenous approach).
# Same network as fabric-std; chaincode verifies a mock ZK proof payload.
test:
  name: zk-exogenous
  description: >
    Throughput and latency with ZK proof verification inside the chaincode
    (exogenous constraint enforcement). Measures overhead vs fabric-std.

  rounds:
    - label: zk-warmup
      description: Warmup - 100 tx at 10 TPS.
      txNumber: 100
      rateControl:
        type: fixed-rate
        opts:
          tps: 10
      workload:
        module: workloads/register-resource.js
        arguments:
          chaincodeId: directed-traceability
          prefix: "zk-w"
          zkProof: true

    - label: zk-sustained
      description: Sustained load - 120 s at 50 TPS with ZK payload.
      txDuration: 120
      rateControl:
        type: fixed-rate
        opts:
          tps: 50
      workload:
        module: workloads/register-resource.js
        arguments:
          chaincodeId: directed-traceability
          prefix: "zk-s"
          zkProof: true

    - label: zk-stress
      description: Stress - 60 s at 200 TPS with ZK payload.
      txDuration: 60
      rateControl:
        type: fixed-rate
        opts:
          tps: 200
      workload:
        module: workloads/register-resource.js
        arguments:
          chaincodeId: directed-traceability
          prefix: "zk-x"
          zkProof: true

# Benchmark: Constraint-aware orderer — M_D endogenous (Paper 3 contribution).
# C_global is enforced inside the Raft leader's block construction path.
# Admission and commit are atomic in a single Raft round.
# IVR = 0 by construction. No coordinator RTT. Intra-block rejection rate > 0
# when competing transactions arrive in the same batch (measured via Prometheus
# consensus_etcdraft_constraint_rejections counter).
test:
  name: orderer-endogenous
  description: >
    M_D endogenous: constraint-aware orderer (Paper 3, §III.A).
    Measures throughput, latency, IVR = 0 guarantee, and intra-block rejection rate.
  workers:
    number: 5
  rounds:
    - label: register-resources
      description: Register 50 resources (warm-up)
      txNumber: 50
      rateControl:
        type: fixed-rate
        opts:
          tps: 20
      workload:
        module: workload/register.js
        arguments:
          resourcesPerWorker: 10
          maxConcurrent: 3
          subsetGroup: "biobank-group-A"

    - label: concurrent-transfer-endogenous
      description: >
        5 agents, K_max=3. Orderer enforces C_global inline.
        IVR = 0. Rejected txs remain in client queue; clients retry after backoff.
      txNumber: 500
      rateControl:
        type: fixed-rate
        opts:
          tps: 100
      workload:
        module: workload/transfer-endogenous.js
        arguments:
          subsetGroup: "biobank-group-A"
          maxConcurrent: 3

monitors:
  resource:
    - module: prometheus
      options:
        url: http://localhost:9090
        metrics:
          include:
            - consensus_etcdraft_committed_block_number
            - consensus_etcdraft_normal_proposals_received
            - consensus_etcdraft_constraint_rejections

---
# Benchmark: orderer-endogenous
# Constraint checking at orderer level (endogenous approach).
# Requires custom orderer image: fabric-orderer-constraint:directed-traceability.
# Run AFTER swapping orderer image in docker-compose and restarting orderers.
test:
  name: orderer-endogenous
  description: >
    Throughput and latency with constraint checking at the orderer
    (endogenous enforcement). Measures overhead vs fabric-std baseline.

  rounds:
    - label: endo-warmup
      description: Warmup - 100 tx at 10 TPS.
      txNumber: 100
      rateControl:
        type: fixed-rate
        opts:
          tps: 10
      workload:
        module: workloads/register-resource.js
        arguments:
          chaincodeId: directed-traceability
          prefix: "endo-w"

    - label: endo-sustained
      description: Sustained load - 120 s at 50 TPS.
      txDuration: 120
      rateControl:
        type: fixed-rate
        opts:
          tps: 50
      workload:
        module: workloads/register-resource.js
        arguments:
          chaincodeId: directed-traceability
          prefix: "endo-s"

    - label: endo-stress
      description: Stress - 60 s at 200 TPS.
      txDuration: 60
      rateControl:
        type: fixed-rate
        opts:
          tps: 200
      workload:
        module: workloads/register-resource.js
        arguments:
          chaincodeId: directed-traceability
          prefix: "endo-x"
